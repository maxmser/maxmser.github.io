# Site configuration. See DECISIONS.md for the reasoning behind each setting.

# The GitHub Actions build overrides baseURL with the Pages URL.
# When moving to a custom domain, change this line and set the domain in
# the repository under Settings > Pages > Custom domain.
baseURL = "https://maxmser.github.io/"
title = "Max Moser"
timeZone = "Europe/Vienna"
disableHugoGeneratorInject = true

# Multilingual setup: English is the default and lives at the root (/).
# A German version can be added later with a [languages.de] block and
# content files named *.de.md next to the English ones.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# No blog: no taxonomies, no RSS feed.
# The sitemap is switched off while the site is set to noindex (see [params]).
# Remove "sitemap" from this list when noindex is removed.
disableKinds = ["taxonomy", "term", "rss", "sitemap"]

[languages.en]
  label = "English"
  locale = "en-GB"  # British English: spelling with -ise, British hyphenation (DECISIONS.md, "Britisches Englisch")
  weight = 1

# Required by the official GitHub Pages workflow (image cache location).
[caches.images]
  dir = ":cacheDir/images"

# An image on a line of its own becomes a figure (layouts/_markup/render-image.html),
# not an image inside a paragraph.
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

# Code blocks without syntax colours: Hugo's default would add a dark Monokai
# background as inline styles, which does not fit the black-and-white design.
[markup.highlight]
  codeFences = false

[params]
  # While the content is still placeholder text, search engines are asked
  # not to index the site. Set to false (or delete) when the content is ready.
  noindex = true

# Every page is rendered twice: index.html carries the font inline for a first
# visit, lean.html links the font file. The service worker serves the lean pages.
# See DECISIONS.md, "Schrift beim ersten Besuch im HTML".
[outputFormats.lean]
  mediaType = "text/html"
  baseName = "lean"
  isHTML = true
  notAlternative = true
  permalinkable = false

[outputs]
  home = ["html", "lean"]
  section = ["html", "lean"]
  page = ["html", "lean"]
