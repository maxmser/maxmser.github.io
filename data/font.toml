# Character set and OpenType features of the web fonts.
# Top level: Geist, the sans-serif (since 2026-11-07, before that Inter). Table [serif]: Crimson Pro.
# Single source for two places, so they never drift apart:
# - tools/build-fonts.py builds static/fonts/geist/ and static/fonts/crimson/ from tools/fonts-src/ with these settings.
# - layouts/_partials/font-check.html stops the build if a page uses a character outside this set.
# After a change here: run `python3 tools/build-fonts.py`. See DECISIONS.md, "Schrift gekürzt".

# Unicode code points, single ("00A7") or ranges ("0020-007E").
unicodes = [
  "0020-007E",            # Basic Latin: English letters, digits, ASCII punctuation
  "00A0",                 # no-break space
  "00A7", "00A9", "00AE", # section sign, copyright, registered
  "00B0", "00B7", "00D7", # degree, middle dot, multiplication sign
  "00C4", "00D6", "00DC", "00DF", "00E4", "00F6", "00FC", # German umlauts and sharp s
  "00E9",                 # e acute (café, résumé)
  "2013", "2014",         # en dash, em dash (Geist has no non-breaking hyphen U+2011)
  "2018", "2019", "201A", "201C", "201D", "201E", # English and German quotation marks
  "2022", "2026",         # bullet, ellipsis
  "2032", "2033",         # prime, double prime
  "20AC", "2122",         # euro, trade mark
  "2190-2193",            # arrows left, up, right, down
  "2212",                 # minus sign
]

# OpenType features kept in addition to the default set of fontTools
# (kerning, ligatures, contextual alternates, marks, fractions and similar).
# ss09: slashed zero and footed one (Geist's only set for figures; replaces Inter's "zero").
features = ["tnum", "ss09"]

# Weight range kept from the variable font.
weight_min = 400
weight_max = 600

# Text font for introductions and running text (.intro-text, .prose), since 2026-11-06.
# Crimson Pro 1.003 from google/fonts (commit 5c70a79), SIL Open Font License.
# Sources in tools/fonts-src/crimson/, output in static/fonts/crimson/.
# Its character set is the list above minus the characters Crimson Pro does not have:
# U+2011 (non-breaking hyphen) and the arrows U+2190 to U+2193. The build stops if
# this list asks for a character the source lacks; font-check.html checks
# running text against it.
[serif]
unicodes = [
  "0020-007E", "00A0", "00A7", "00A9", "00AE", "00B0", "00B7", "00D7",
  "00C4", "00D6", "00DC", "00DF", "00E4", "00F6", "00FC", "00E9",
  "2013", "2014", "2018", "2019", "201A", "201C", "201D", "201E",
  "2022", "2026", "2032", "2033", "20AC", "2122", "2212",
]
features = ["tnum", "onum", "lnum"]  # oldstyle figures in running text, lining on request
weight_min = 340
weight_max = 500
