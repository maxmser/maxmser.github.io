{{ define "main" }}
<section class="intro">
  <h1 class="display">{{ partial "typo.html" (dict "page" . "text" .Title) }}</h1>
  {{- with .Content }}
  <div class="intro-text prose">{{ . }}</div>
  {{- end }}
</section>
{{- with site.GetPage "/projects" }}
<section class="block" aria-labelledby="projects-heading">
  <h2 id="projects-heading" class="block-label">{{ T "projects" }}</h2>
  {{ partial "project-list.html" .RegularPages }}
</section>
{{- end }}
{{ partial "more-projects.html" . }}
{{ end }}
