{{- /* Simple text page, used with "layout: text" in the front matter (for example the imprint). */}}
{{ define "main" }}
<article class="article">
  <header class="intro">
    <h1 class="display">{{ partial "typo.html" (dict "page" . "text" .Title) }}</h1>
    {{- with partial "lead.html" .Content }}
    <div class="intro-lead prose">{{ . | safeHTML }}</div>
    {{- end }}
  </header>
  {{ partial "sections.html" .Content }}
</article>
{{ end }}
